    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_KEY'

  # Ops team - for hardware issues
  - name: 'ops-team'
    # Uncomment and configure your notification method
    # slack_configs:
    #   - channel: '#gpu-ops-critical'
    #     title: '🚨 CRITICAL GPU Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ .Annotations.recommendation }}{{ end }}'
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_KEY'
    #     severity: 'critical'

# Inhibit rules - suppress certain alerts when others are firing
inhibit_rules:
  # Inhibit low utilization alerts when GPU is down
  - source_match:
      severity: 'critical'
      category: 'hardware'
    target_match:
      category: 'waste'
    equal: ['instance', 'gpu']
