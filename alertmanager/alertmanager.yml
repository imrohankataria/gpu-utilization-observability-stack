global:
  resolve_timeout: 5m
  slack_api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'  # Replace with your Slack webhook URL

# Default route and receiver
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Route for waste/cost alerts
    - match:
        category: waste
      receiver: 'cost-optimization-team'
      continue: true
    
    # Route for VRAM misuse
    - match:
        category: vram_misuse
      receiver: 'infrastructure-team'
      continue: true
    
    # Route for over-allocation issues
    - match:
        category: over_allocation
      receiver: 'infrastructure-team'
      continue: true
    
    # Route for hardware issues
    - match:
        category: hardware
      receiver: 'ops-team'
      severity: critical

receivers:
  # Default receiver - logs to console
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  # Cost optimization team - for waste alerts
  - name: 'cost-optimization-team'
